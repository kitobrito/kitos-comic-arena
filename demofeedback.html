<!DOCTYPE html>
<html lang="en" data-portal>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Feedback</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles/pokemon-portal.css?v=ground-up-v8" />
  <style>
    body { padding: 0; }
    .df-shell { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; display: grid; gap: 18px; }
    .df-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .df-header h1 { margin: 0; font-family: var(--pp-font-display); font-size: 22px; color: var(--pp-ink); }
    .df-back { color: var(--pp-accent-bright); text-decoration: none; font-size: 13px; font-weight: 700; }
    .df-filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .df-filter select { max-width: 220px; }
    .df-entry { display: grid; gap: 8px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--pp-line); background: var(--pp-bg-raised); }
    .df-entry-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .df-entry-meta { font-size: 11.5px; color: var(--pp-ink-faint); }
    .df-entry-meta strong { color: var(--pp-accent-bright); }
    .df-entry-message { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--pp-ink); white-space: pre-wrap; }
    .df-entry-delete { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--pp-line-strong); background: var(--pp-bg-panel); color: var(--pp-ink-faint); font-size: 11px; font-weight: 700; cursor: pointer; }
    .df-entry-delete:hover { border-color: var(--pp-accent); color: var(--pp-accent-bright); }
    .df-empty { padding: 30px; text-align: center; color: var(--pp-ink-faint); border: 1px dashed var(--pp-line-strong); border-radius: 12px; }
  </style>
</head>
<body class="pp-body" data-page-arena="pokemon" data-portal-section="home">
  <div class="df-shell">
    <div class="df-header">
      <h1>Demo Feedback</h1>
      <a class="df-back" href="/pokemon">&larr; Back to Pokemon Arena</a>
    </div>
    <div class="df-filter">
      <label for="df-demo-filter" style="font-size:12px;color:var(--pp-ink-faint);">Filter:</label>
      <select class="pp-field" id="df-demo-filter" style="margin:0;">
        <option value="all">All demos</option>
      </select>
    </div>
    <p class="pp-status" id="df-status" aria-live="polite"></p>
    <div id="df-list"></div>
  </div>

  <script>
    (function () {
      var status = document.getElementById('df-status');
      var list = document.getElementById('df-list');
      var demoFilter = document.getElementById('df-demo-filter');
      var allEntries = [];
      var demoNameById = {};

      function setStatus(message, state) {
        if (!status) return;
        status.textContent = message || '';
        if (state) status.dataset.state = state; else delete status.dataset.state;
      }

      function formatDate(value) {
        if (!value) return 'Unknown';
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return 'Unknown';
        return date.toLocaleString();
      }

      function render() {
        if (!list) return;
        list.innerHTML = '';
        var filterValue = demoFilter ? demoFilter.value : 'all';
        var filtered = allEntries.filter(function (entry) {
          return filterValue === 'all' || entry.demoId === filterValue;
        });
        if (!filtered.length) {
          var empty = document.createElement('div');
          empty.className = 'df-empty';
          empty.textContent = 'No feedback yet.';
          list.appendChild(empty);
          return;
        }
        filtered.forEach(function (entry) {
          var card = document.createElement('article');
          card.className = 'df-entry';

          var head = document.createElement('div');
          head.className = 'df-entry-head';

          var meta = document.createElement('div');
          meta.className = 'df-entry-meta';
          var demoLabel = demoNameById[entry.demoId] || entry.demoId || 'Unknown demo';
          meta.innerHTML = '<strong>' + demoLabel + '</strong> &middot; ' + (entry.username || 'Guest') + ' &middot; ' + formatDate(entry.createdAt);

          var deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'df-entry-delete';
          deleteButton.textContent = 'Delete';
          deleteButton.addEventListener('click', async function () {
            deleteButton.disabled = true;
            try {
              var response = await fetch('/api/admin/demo-feedback/' + encodeURIComponent(entry.id), {
                method: 'DELETE',
                credentials: 'same-origin'
              });
              if (!response.ok) {
                deleteButton.disabled = false;
                return;
              }
              allEntries = allEntries.filter(function (item) { return item.id !== entry.id; });
              render();
            } catch (error) {
              deleteButton.disabled = false;
            }
          });

          head.appendChild(meta);
          head.appendChild(deleteButton);

          var message = document.createElement('p');
          message.className = 'df-entry-message';
          message.textContent = entry.message || '';

          card.appendChild(head);
          card.appendChild(message);
          list.appendChild(card);
        });
      }

      async function load() {
        setStatus('Loading feedback...');
        try {
          var response = await fetch('/api/admin/demo-feedback', { credentials: 'same-origin' });
          var data = await response.json().catch(function () { return {}; });
          if (response.status === 403) {
            setStatus('Admin access required.', 'error');
            return;
          }
          if (!response.ok) {
            setStatus(data && data.error ? data.error : 'Unable to load feedback.', 'error');
            return;
          }
          allEntries = Array.isArray(data.entries) ? data.entries : [];
          var demos = Array.isArray(data.demos) ? data.demos : [];
          demos.forEach(function (demo) {
            demoNameById[demo.id] = demo.name || demo.id;
            var option = document.createElement('option');
            option.value = demo.id;
            option.textContent = demo.name || demo.id;
            demoFilter.appendChild(option);
          });
          setStatus(allEntries.length + ' feedback entries loaded.');
          render();
        } catch (error) {
          setStatus('Unable to reach the server.', 'error');
        }
      }

      if (demoFilter) {
        demoFilter.addEventListener('change', render);
      }

      load();
    }());
  </script>
</body>
</html>
